#### Animations 
transition-length = 0
transition-pow-x = 0
transition-pow-y = 0
transition-pow-w = 0
transition-pow-h = 0
size-transition = true

#### Corners
corner-radius = 1.0;
rounded-corners-exclude = [
  #"window_type = 'normal'",
  "class_g = 'Polybar'",
  "class_g = 'dwm'",
];
round-borders = 0;
round-borders-exclude = [
];

#### Shadows
shadow = false;
#shadow-radius = 20;
#shadow-opacity = 0.7
#shadow-offset-x = -15;
#shadow-offset-y = -18;
# no-dock-shadow = false
# no-dnd-shadow = false
# shadow-red = 0
# shadow-green = 0
# shadow-blue = 0
# shadow-ignore-shaped = ''
# shadow-exclude = []
shadow-exclude = [
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];
# shadow-exclude-reg = ""

#### Fading
fading = true;
fade-in-step = 1;
fade-out-step = 1;
fade-delta = 2;
fade-exclude = [
  "class_g = 'slop'"   # maim
]
#no-fading-openclose = false
# no-fading-destroyed-argb = false

#### Transparency / Opacity
detect-client-opacity = true;
#inactive-opacity = 0.40;
frame-opacity = 1.0;
#menu-opacity = 1.0
popup_menu = { opacity = 1.0; }
dropdown_menu = { opacity = 1.0; }
inactive-opacity-override = true;
#active-opacity = 1.0;
#inactive-dim = 0.4
focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Bar'",                    # lemonbar
  "class_g = 'slop'",                    # maim
  "class_g = 'steam'",
  "class_g = 'escrotum'"
];
# inactive-dim-fixed = 1.0
opacity-rule = [
  "80:class_g     = 'Bar'",             # lemonbar
  "100:class_g    = 'slop'",            # maim
  "100:class_g    = 'XTerm'",
  "100:class_g    = 'URxvt'",
  "100:class_g    = 'kitty'",
  "100:class_g    = 'Alacritty'",
  "100:class_g     = 'Polybar'",
  "100:class_g    = 'code-oss'",
  "100:class_g    = 'Meld'",
  "95:class_g     = 'TelegramDesktop'",
  "95:class_g     = 'jetbrains-clion'",
  "95:class_g     = 'discord'",
  "90:class_g     = 'Joplin'",
  "100:class_g    = 'firefox'",
  "100:class_g    = 'Thunderbird'",
  "0:_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

